server {
    listen 80;
    listen 443 ssl http2;
    server_name peixin.uno;
    index index.html index.htm;
    root /www/wwwroot/dist;

    include mime.types;
    default_type application/octet-stream;

    # SSL 证书路径
    ssl_certificate    /www/server/panel/vhost/cert/boke/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/boke/privkey.pem;

    # 1. 头像目录访问
    location /toux/ {
        alias /www/wwwroot/public/toux/;
        add_header Access-Control-Allow-Origin *;
    }

    # 2. 关键修复：强制匹配 public 文件夹下的所有文件
    location /public/ {
        alias /www/wwwroot/public/;
        add_header Access-Control-Allow-Origin *;

        # 针对特定后缀名，强制声明为下载流，防止被当成网页
        location ~* \.(xlsx|xmin|xmind|zip|md)$ {
            add_header Content-Type application/octet-stream;
        }
        # MD 文件设为纯文本
        location ~* \.md$ {
            add_header Content-Type text/plain;
        }
    }

    # 3. 修复 API 转发
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. 前端路由（注意：这个要放最后）
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/boke.log;
    error_log /www/wwwlogs/boke.error.log;
}
